services:
  - type: web
    name: yazoo-dst-ai-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: "apt-get update && apt-get install -y potrace && pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
